<!doctype html>
<!-- Source for the email signature lockup (300x60, rendered at 2x). Never deployed (.vercelignore).
     ?bg=white for the Gmail signature, ?bg=cream for the enquiry auto-reply.
     Render: see the design spec, section 7.14. The italic subline is the signature's own
     exception to the no-italics rule, ruled by Jasmin on 13 September 2026. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=block" rel="stylesheet">
<style>
@font-face{font-family:Chillax;font-weight:700;src:url("../Fonts/CHILLAX/OTF/Chillax-Bold.otf")}
*{margin:0;padding:0}
html,body{width:300px;height:60px;overflow:hidden;background:#FFFFFF}
body{padding-left:2px;box-sizing:border-box} /* the Chillax J's hook sits left of its origin */
body.cream{background:#FAF8F4}
.name{font:700 24px/1 Chillax;letter-spacing:-0.02em;color:#14110D;padding-top:5px}
.sub{font:italic 400 15px/1 'Source Serif 4',Georgia,serif;color:#5255B5;margin-top:10px}
</style></head>
<body>
<div class="name">Jasmin Aziz</div>
<div class="sub">Strategic marketing, communications &amp; AI</div>
<script>if (new URLSearchParams(location.search).get('bg') === 'cream') document.body.className = 'cream';</script>
</body></html>
